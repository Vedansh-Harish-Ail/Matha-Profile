<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients for Metallic Effect -->
    <linearGradient id="gold-grad-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="30%" stop-color="#FFA751" />
      <stop offset="50%" stop-color="#FFE259" />
      <stop offset="70%" stop-color="#E1A95F" />
      <stop offset="100%" stop-color="#B37D14" />
    </linearGradient>
    
    <linearGradient id="gold-grad-inner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF5C9" />
      <stop offset="50%" stop-color="#FFA751" />
      <stop offset="100%" stop-color="#8A5A00" />
    </linearGradient>

    <radialGradient id="sparkle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="30%" stop-color="#FFE259" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFA751" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Premium Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Glow Group -->
  <g filter="url(#shadow)">
    <!-- Outer Glitter Border (Simulated Sparkles) -->
    <circle cx="200" cy="200" r="185" fill="none" stroke="url(#gold-grad-outer)" stroke-width="4" stroke-dasharray="2 6" opacity="0.8" />
    
    <!-- Outer Solid Rim -->
    <circle cx="200" cy="200" r="175" fill="url(#gold-grad-outer)" />
    
    <!-- Mid Rim Shadow -->
    <circle cx="200" cy="200" r="162" fill="#030816" opacity="0.15" />
    
    <!-- Inner Gold Face -->
    <circle cx="200" cy="200" r="160" fill="url(#gold-grad-inner)" />
    
    <!-- Inner Thin Ring -->
    <circle cx="200" cy="200" r="150" fill="none" stroke="#684700" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Sparkles around the rim -->
  <g opacity="0.8">
    <circle cx="100" cy="80" r="6" fill="url(#sparkle-glow)" />
    <path d="M100 70 L100 90 M90 80 L110 80" stroke="#FFFFFF" stroke-width="1.5" />
    
    <circle cx="300" cy="80" r="8" fill="url(#sparkle-glow)" />
    <path d="M300 68 L300 92 M288 80 L312 80" stroke="#FFFFFF" stroke-width="1.5" />
    
    <circle cx="50" cy="200" r="5" fill="url(#sparkle-glow)" />
    <path d="M50 192 L50 208 M42 200 L58 200" stroke="#FFFFFF" stroke-width="1" />
    
    <circle cx="350" cy="220" r="6" fill="url(#sparkle-glow)" />
    <path d="M350 210 L350 230 M340 220 L360 220" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Typography Content -->
  <!-- Letter 'M' -->
  <text x="200" y="195" 
        font-family="Georgia, serif" 
        font-size="120" 
        font-weight="bold" 
        fill="#06112C" 
        text-anchor="middle"
        letter-spacing="-5">M</text>

  <!-- MATA REFRIGERATION Text -->
  <text x="200" y="245" 
        font-family="'Inter', sans-serif" 
        font-size="21" 
        font-weight="900" 
        fill="#06112C" 
        text-anchor="middle" 
        letter-spacing="2">MATA</text>
        
  <text x="200" y="272" 
        font-family="'Inter', sans-serif" 
        font-size="16" 
        font-weight="900" 
        fill="#06112C" 
        text-anchor="middle" 
        letter-spacing="2.5">REFRIGERATION</text>

  <!-- NAVI MUMBAI location in red -->
  <rect x="110" y="295" width="180" height="28" rx="14" fill="#06112C" opacity="0.08" />
  
  <text x="200" y="314" 
        font-family="'Inter', sans-serif" 
        font-size="15" 
        font-weight="800" 
        fill="#D32F2F" 
        text-anchor="middle" 
        letter-spacing="1">NAVI MUMBAI</text>
</svg>
